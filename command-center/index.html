<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stapphire | Development Command Center</title><link rel="icon" type="image/svg+xml" href="./stapphire-white.svg"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf7;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:20px 28px;border-bottom:1px solid #273149;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#10182a}header h1{font-size:20px;margin:0}header small{color:#98a6c0}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 78px)}aside{padding:20px 12px;border-right:1px solid #273149;background:#10182a}aside button{display:block;width:100%;text-align:left;border:0;background:none;color:#abb8d1;padding:13px 15px;border-radius:10px;margin-bottom:5px}aside button.active,aside button:hover{background:#273454;color:white}main{padding:28px;max-width:1400px;width:100%;margin:auto}h2{margin:0 0 8px}h3{margin:0 0 12px}.muted{color:#9daac2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}.card,.panel{background:#151f34;border:1px solid #2a3853;border-radius:14px;padding:20px}.metric{font-size:32px;font-weight:750;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:1px solid #465778;background:#253755;color:#f4f7ff;border-radius:9px;padding:10px 14px}.btn.primary{background:#5878d7;border-color:#5878d7}.btn.danger{border-color:#864e5b;background:#4a2935}.btn:hover{filter:brightness(1.15)}input,textarea,select{width:100%;background:#0d172a;color:white;border:1px solid #40516e;border-radius:8px;padding:10px;margin-top:5px}textarea{min-height:120px;resize:vertical}label{display:block;color:#bec9df;font-size:13px;margin:12px 0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;text-align:left;border-bottom:1px solid #2c3952;vertical-align:top}th{color:#b1bed7;font-size:13px}tr:hover{background:#1c2942}.pill{font-size:12px;padding:4px 9px;border-radius:20px;background:#2b3d5e;white-space:nowrap}.tag{font-size:12px;color:#b9c9e6}.columns{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;overflow-x:auto}.column{background:#101a2c;padding:12px;border-radius:12px;min-height:270px}.item{padding:13px;background:#1a2841;border:1px solid #32415e;border-radius:10px;margin:10px 0}.item b{display:block;margin-bottom:8px}.hidden{display:none!important}.note{border-left:3px solid #7a99f0;padding:10px 14px;background:#17233c;margin:15px 0}.empty{color:#a3b1cc;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{max-width:320px;margin:0}.stack>*+*{margin-top:12px}@media(max-width:800px){.shell{display:block}aside{display:flex;overflow:auto;padding:8px}aside button{white-space:nowrap;width:auto}main{padding:18px}.columns{grid-template-columns:repeat(4,240px)}table{display:block;overflow-x:auto}header{padding:16px}}

:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef9;background:#080e19}
body{background:radial-gradient(circle at 80% -10%,#17274b 0,transparent 32%),#080e19}
header{background:#0d1524;border-bottom:1px solid #24334b;padding:18px 30px}
header h1{letter-spacing:-.5px;font-size:21px}
header small{font-size:12px}
.shell{grid-template-columns:244px 1fr}
aside{background:#0d1524;border-right:1px solid #24334b;padding:26px 12px}
aside:before{content:"WORKSPACE";display:block;color:#637796;font-size:10px;letter-spacing:2px;font-weight:800;padding:4px 16px 15px}
aside button{border-radius:9px;padding:13px 15px;font-size:13px;font-weight:600}
aside button.active{background:#1e3455;border-left:3px solid #72a8fa;color:#e9f4ff}
main{padding:36px;max-width:1550px}
h2{font-size:27px;letter-spacing:-.8px}h3{font-size:15px}
.muted{color:#93a4bf}
.card,.panel{background:linear-gradient(145deg,#142239,#111b2d);border:1px solid #293b56;border-radius:15px;box-shadow:0 7px 20px #00000017}
.card{padding:22px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#75a7f5,transparent)}
.metric{font-size:35px;letter-spacing:-1px;color:#f3f8ff}
.cards{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn.primary{background:#3f78d8}
.btn{font-size:12px;font-weight:650}
table{font-size:13px}
.note{border:1px solid #355070;background:#14253b;border-radius:10px;padding:15px;margin-top:22px;color:#afc7e6;font-size:13px}
.hero{padding:25px 28px;background:linear-gradient(110deg,#193a67,#17253e 70%);border:1px solid #365781;border-radius:16px;display:flex;justify-content:space-between;gap:20px;align-items:center}
.hero .eyebrow{font-size:11px;color:#9bc6ff;text-transform:uppercase;letter-spacing:2px;font-weight:750}
.hero h2{margin:7px 0}
.hero p{margin:0;color:#b8cce8;font-size:13px;max-width:720px;line-height:1.6}
.hero .status{white-space:nowrap;font-size:12px;border:1px solid #5581b3;border-radius:30px;padding:9px 14px;color:#c6e2ff}
.section-heading{margin:28px 0 13px;display:flex;justify-content:space-between;align-items:center}
.section-heading h3{margin:0;font-size:16px}
.pillar{padding:14px 0;border-bottom:1px solid #293b56}
.pillar:last-child{border:0}
.pillar strong{display:block;font-size:13px}
.pillar span{font-size:12px;color:#91a6c6;line-height:1.5}
.progress-track{height:7px;border-radius:10px;background:#29374e;overflow:hidden;margin:12px 0 4px}
.progress-fill{height:100%;background:linear-gradient(90deg,#4c8df3,#72c3ff);border-radius:10px}
.kicker{font-size:11px;color:#90a8cb;text-transform:uppercase;letter-spacing:1px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px}aside:before{display:none}aside button{white-space:nowrap;width:auto}main{padding:18px}.hero{flex-direction:column;align-items:flex-start}header{flex-wrap:wrap;padding:15px}}
.external-link{display:inline-flex;align-items:center;text-decoration:none;background:#1d3657;border:1px solid #41648f;color:#e1eeff;white-space:nowrap}.external-link:hover{background:#294a76}header .toolbar{display:flex;flex-wrap:wrap;gap:8px}</style></head><body><header><div><h1 style="display:flex;align-items:center;gap:12px"><img src="./stapphire-white.svg" alt="Stapphire unicorn" width="42" height="45" style="display:block;object-fit:contain"> <span>Stapphire <span style="font-weight:400;color:#9daed2">/ Development Command Center</span></span></h1><small>Private planning workspace · Notion sync</small></div><div class="toolbar"><a class="btn external-link" href="https://app.notion.com/p/4124afa7d4a08118867ae4b5ee932d43" target="_blank" rel="noopener noreferrer">↗ Stapphire Notion</a><a class="btn external-link" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">↗ ChatGPT</a><button class="btn" onclick="connectCloud()">Connect Notion</button><button class="btn primary" onclick="publishCloud()">Publish local data</button><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="document.getElementById('importfile').click()">Import JSON</button><input id="importfile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></header><div id="syncstatus" role="status" style="padding:8px 30px;background:#14253b;color:#b8d6ff;font-size:12px">Local browser data · click Connect Notion to load shared records</div><div class="shell"><aside id="nav"></aside><main id="content"></main></div><script>
const key='stapphire-command-center-v1';const initial={features:[
{id:'F-001',name:'Recruiter requisition and candidate workspace',area:'Recruiter',phase:'MVP',status:'Planned',priority:'Critical',details:'Relational requisition, candidate and application records; search, update, import/export and activity history.',criteria:'Recruiter can create a requisition, associate candidates and maintain application-specific history.'},
{id:'F-002',name:'Client management for internal and agency recruiters',area:'Recruiter',phase:'MVP',status:'Planned',priority:'Critical',details:'Support employer and client records, contacts, assigned requisitions and client-specific access controls.',criteria:'Agency users can manage multiple clients without cross-client data exposure.'},
{id:'F-003',name:'Candidate disposition alerts and network invitations',area:'Network',phase:'MVP',status:'Planned',priority:'Critical',details:'Mandatory Screen, Interview and DNS; secure candidate alert and email notification; nonmembers invited to network on DNS only.',criteria:'Disposition triggers one appropriate notification; private notes are not exposed; invitation is consent-based.'},
{id:'F-004',name:'Reusable recruiter outreach templates',area:'Recruiter',phase:'MVP',status:'Planned',priority:'High',details:'Template dropdown; editable personalized message; auto-fill candidate, requisition, employer, recruiter and application URL; personal and team templates.',criteria:'Editing one outgoing message does not overwrite saved template.'},
{id:'F-005',name:'Explainable criteria-based candidate matching',area:'Network',phase:'Later',status:'Backlog',priority:'High',details:'Display criteria-alignment score with evidence, uncertainty and recruiter review; do not imply hiring probability.',criteria:'Recruiter can inspect evidence supporting the match score.'},
{id:'F-006',name:'Jobseeker workspace and OPNX-OS tools',area:'Jobseeker',phase:'Later',status:'Backlog',priority:'High',details:'Free network participation; paid active job-search workspace; OPNX-OS strategic tools.',criteria:'Free participant remains discoverable without paid workspace.'},
{id:'F-007',name:'Advantage AI credits and billing',area:'Jobseeker',phase:'Later',status:'Backlog',priority:'Medium',details:'$19.99 monthly proposed; subscription credits reset, purchased credits carry forward; subscription balance consumed first; no automatic top-up.',criteria:'Balances tracked separately and purchases persist across renewals.'},
{id:'F-008',name:'Hiring-team and client review portal',area:'Recruiter',phase:'Later',status:'Backlog',priority:'High',details:'Scoped candidate reviews, comments, feedback and permissions for internal hiring managers and agency clients.',criteria:'External clients cannot see unrelated clients or private recruiting records.'},
{id:'F-009',name:'Conversation-to-specification approval workflow',area:'Command Center',phase:'MVP',status:'In Progress',priority:'Critical',details:'Convert developed conversations into reviewed actionable specs; publish only after owner approval; preserve source and rationale.',criteria:'Draft can be reviewed and approved before any future Notion publication.'}
],decisions:[
{id:'D-001',title:'Free participation is not gated by subscriptions',area:'Business Model',state:'Approved',rationale:'Candidates can be discovered and contacted without paying; paid tiers provide active job-search tools.'},
{id:'D-002',title:'AI credit balances remain distinct',area:'Business Model',state:'Approved',rationale:'Monthly subscription credits expire at reset; purchased credits carry forward and are used afterward.'},
{id:'D-003',title:'Accountability follows control and applicable law',area:'Governance',state:'Approved',rationale:'Recruiters control representation and candidate submissions; Stapphire remains responsible for its own platform obligations.'},
{id:'D-004',title:'Support internal, contract and agency recruiting',area:'Architecture',state:'Approved',rationale:'Client relationships and scoped permissions must be foundational.'},
{id:'D-005',title:'Capture actionable conclusions, not raw brainstorming',area:'Command Center',state:'Approved',rationale:'Human-reviewed specifications enter the official roadmap.'}
],captures:[],tasks:[]};let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(initial)}catch{db=structuredClone(initial)};let page='Overview';let cloudRevision=null,cloudEnabled=false,syncBusy=false,syncTimer=null;function persist(){localStorage.setItem(key,JSON.stringify(db));if(cloudEnabled){clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,800)}}async function saveCloud(){if(syncBusy)return;syncBusy=true;try{const r=await fetch('./api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:db,revision:cloudRevision})});const j=await r.json();if(!r.ok)throw Error(j.error||'Sync failed');cloudRevision=j.revision;setSyncStatus('Synced with Notion')}catch(e){cloudEnabled=false;setSyncStatus('Sync stopped: '+e.message+' — local copy retained')}finally{syncBusy=false}}function setSyncStatus(message){const el=document.getElementById('syncstatus');if(el)el.textContent=message}async function connectCloud(){setSyncStatus('Connecting to Notion…');try{const r=await fetch('./api/state',{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Connection failed');cloudRevision=j.revision;if(j.data){if(!confirm('Load the authoritative Notion workspace? A backup of current browser data will be retained.')){setSyncStatus('Notion available · local workspace retained');return}localStorage.setItem(key+'-pre-cloud-backup',JSON.stringify(db));db=j.data;localStorage.setItem(key,JSON.stringify(db));cloudEnabled=true;setSyncStatus('Connected to Notion');render()}else{setSyncStatus('Notion connected · no cloud state yet. Use Publish local data to initialize.')}}catch(e){setSyncStatus('Connection error: '+e.message)}}async function publishCloud(){if(!confirm('Publish current browser workspace to Notion? Export JSON first for a portable backup.'))return;try{const r=await fetch('./api/state',{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Connection failed');if(j.data){alert('Notion already contains data. Connect and load it first.');return}cloudRevision=null;cloudEnabled=true;await saveCloud()}catch(e){cloudEnabled=false;setSyncStatus('Publish failed: '+e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function navigate(p){page=p;render()}function render(){let tabs=['Overview','Roadmap','Features','Decisions','Conversation Capture','Governance'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="navigate('${t}')">${({Overview:'◈',Roadmap:'▦',Features:'◉',Decisions:'◇','Conversation Capture':'✎',Governance:'⚖'})[t]} &nbsp; ${t}</button>`).join('');let el=document.getElementById('content');el.innerHTML=({Overview:overview,Roadmap:roadmap,Features:features,Decisions:decisions,'Conversation Capture':captures,Governance:governance})[page]();}
function overview(){let counts={planned:db.features.filter(f=>f.status==='Planned').length,progress:db.features.filter(f=>f.status==='In Progress').length,approved:db.decisions.filter(d=>d.state==='Approved').length,pending:db.captures.filter(c=>c.state==='Draft').length};let total=db.features.length;let done=db.features.filter(f=>f.status==='Released'||f.status==='Complete').length;return `<div class="hero"><div><div class="eyebrow">Product development / Private workspace</div><h2>Stapphire Command Center</h2><p>One place to turn product strategy into approved specifications, coordinated development, and traceable decisions. Recruiter workspace first; network and jobseeker architecture preserved.</p></div><div class="status">● Notion-ready workspace</div></div><div class="section-heading"><h3>At a glance</h3><span class="kicker">Workspace data</span></div><div class="cards">${[['Features tracked',total],['Planned',counts.planned],['In development',counts.progress],['Approved decisions',counts.approved],['Awaiting review',counts.pending]].map(([a,b])=>`<div class="card"><div class="kicker">${a}</div><div class="metric">${b}</div></div>`).join('')}</div><div class="grid"><section class="panel"><div class="row"><h3>Development pipeline</h3><button class="btn" onclick="navigate('Roadmap')">Open roadmap →</button></div><p class="muted" style="font-size:13px">Progress across the registered product capabilities</p><div class="progress-track"><div class="progress-fill" style="width:${total?Math.round(done/total*100):0}%"></div></div><p class="muted" style="font-size:12px">${done} released or complete · ${total-done} remaining</p><div class="section-heading"><h3>Next execution priorities</h3></div>${db.features.filter(f=>f.phase==='MVP').slice(0,6).map(f=>`<div class="item"><b>${esc(f.name)}</b><span class="tag">${esc(f.status)} · ${esc(f.area)}</span></div>`).join('')||'<p class="muted">No MVP priorities recorded.</p>'}</section><section class="panel"><div class="row"><h3>Product architecture</h3><button class="btn" onclick="navigate('Features')">Feature registry →</button></div><div class="pillar"><strong>01 / Recruiter workspace</strong><span>Requisitions, candidate relationships, client management and hiring-team collaboration</span></div><div class="pillar"><strong>02 / Talent network</strong><span>Candidate-controlled discoverability, direct contact and transparent disposition alerts</span></div><div class="pillar"><strong>03 / Jobseeker intelligence</strong><span>Active search workflow, reverse recruiting and explainable AI assistance</span></div><div class="pillar"><strong>04 / Platform governance</strong><span>Privacy, authorization, consent, representation and audit trails</span></div></section></div><div class="section-heading"><h3>Command actions</h3></div><div class="grid"><section class="panel"><div class="kicker">01 / Capture</div><h3>Conversation → Specification</h3><p class="muted" style="font-size:13px">Turn a mature idea into a reviewable draft before it enters the official roadmap.</p><button class="btn primary" onclick="navigate('Conversation Capture')">Review captures →</button></section><section class="panel"><div class="kicker">02 / Govern</div><h3>Decisions & accountability</h3><p class="muted" style="font-size:13px">Keep product rules, ownership boundaries, and decision rationale visible.</p><button class="btn" onclick="navigate('Decisions')">Open decisions →</button></section></div><div class="note">Integration: connect to Notion to load shared records. Publish local data only once to initialize the Notion workspace. Export a JSON backup before migration.</div>`}
function roadmap(){let statuses=['Backlog','Planned','In Progress','Done'];return `<div class="row"><div><h2>Development Roadmap</h2><p class="muted">Change a feature's status from its card. Phases and priorities are planning suggestions.</p></div></div><div class="columns">${statuses.map(s=>`<div class="column"><h3>${s} <span class="tag">(${db.features.filter(f=>f.status===s).length})</span></h3>${db.features.filter(f=>f.status===s).map(f=>`<div class="item"><b>${esc(f.name)}</b><div class="tag">${esc(f.id)} · ${esc(f.phase)} · ${esc(f.priority)}</div><select aria-label="Change status" onchange="updateFeature('${f.id}','status',this.value)">${statuses.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>`}
function features(){return `<div class="row"><div><h2>Feature Registry</h2><p class="muted">Specifications, scope and acceptance criteria.</p></div><button class="btn primary" onclick="showFeatureForm()">+ Add feature</button></div><div class="toolbar"><input id="featureSearch" placeholder="Search features" oninput="filterFeatures()"><select id="areaFilter" style="width:190px" onchange="filterFeatures()"><option value="">All areas</option>${['Recruiter','Network','Jobseeker','Command Center'].map(a=>`<option>${a}</option>`).join('')}</select></div><div id="featureRows">${featureRows(db.features)}</div><div id="featureForm"></div>`}function featureRows(arr){return `<table><thead><tr><th>Feature</th><th>Area / Phase</th><th>Status</th><th>Priority</th><th>Details</th></tr></thead><tbody>${arr.map(f=>`<tr><td><b>${esc(f.name)}</b><div class="tag">${esc(f.id)}</div></td><td>${esc(f.area)}<br><span class="tag">${esc(f.phase)}</span></td><td><span class="pill">${esc(f.status)}</span></td><td>${esc(f.priority)}</td><td>${esc(f.details)}<details><summary>Acceptance criteria</summary>${esc(f.criteria)}</details></td></tr>`).join('')}</tbody></table>`}function filterFeatures(){let q=document.getElementById('featureSearch').value.toLowerCase(),a=document.getElementById('areaFilter').value;document.getElementById('featureRows').innerHTML=featureRows(db.features.filter(f=>(!a||f.area===a)&&JSON.stringify(f).toLowerCase().includes(q)))}function showFeatureForm(){document.getElementById('featureForm').innerHTML=`<section class="panel"><h3>New feature</h3><form onsubmit="addFeature(event)"><label>Name<input name="name" required></label><label>Area<select name="area">${['Recruiter','Network','Jobseeker','Command Center'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Phase<select name="phase"><option>MVP</option><option>Later</option></select></label><label>Requirements<textarea name="details" required></textarea></label><label>Acceptance criteria<textarea name="criteria"></textarea></label><button class="btn primary">Save feature</button></form></section>`}function addFeature(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));db.features.push({id:'F-'+String(Date.now()).slice(-7),...v,status:'Backlog',priority:'Medium'});persist();render()}function updateFeature(id,field,val){db.features.find(f=>f.id===id)[field]=val;persist();render()}
function decisions(){return `<div class="row"><div><h2>Decision Register</h2><p class="muted">Confirmed principles and their rationale.</p></div><button class="btn primary" onclick="document.getElementById('decisionForm').classList.toggle('hidden')">+ Add decision</button></div><div id="decisionForm" class="panel hidden"><form onsubmit="addDecision(event)"><label>Decision<input name="title" required></label><label>Area<input name="area" required></label><label>Rationale<textarea name="rationale" required></textarea></label><label>State<select name="state"><option>Proposed</option><option>Approved</option></select></label><button class="btn primary">Save</button></form></div><div class="stack">${db.decisions.map(d=>`<div class="panel"><div class="row"><b>${esc(d.title)}</b><span class="pill">${esc(d.state)}</span></div><p class="muted">${esc(d.id)} · ${esc(d.area)}</p><p>${esc(d.rationale)}</p></div>`).join('')}</div>`}function addDecision(e){e.preventDefault();db.decisions.push({id:'D-'+String(Date.now()).slice(-7),...Object.fromEntries(new FormData(e.target))});persist();render()}
function captures(){return `<h2>Conversation → Specification</h2><p class="muted">Enter a distilled, actionable specification. Approve before marking it ready for publication.</p><div class="grid"><section class="panel"><h3>New capture draft</h3><form onsubmit="addCapture(event)"><label>Feature / initiative title<input name="title" required placeholder="e.g. Recruiter outreach templates"></label><label>Business objective<textarea name="objective" required placeholder="What problem does this solve?"></textarea></label><label>Functional requirements<textarea name="requirements" required placeholder="Specific behavior the product must support"></textarea></label><label>Acceptance criteria<textarea name="criteria" required placeholder="How will we know this works?"></textarea></label><label>Dependencies / open questions<textarea name="dependencies"></textarea></label><label>Source conversation reference (optional)<input name="source" placeholder="Conversation title or URL"></label><button class="btn primary">Save draft for review</button></form></section><section class="panel"><h3>Review queue</h3>${db.captures.length?db.captures.map(c=>`<div class="item"><div class="row"><b>${esc(c.title)}</b><span class="pill">${esc(c.state)}</span></div><p class="tag">${esc(c.created)}</p><p><b>Objective:</b> ${esc(c.objective)}</p><details><summary>Full specification</summary><p><b>Requirements</b><br>${esc(c.requirements)}</p><p><b>Acceptance</b><br>${esc(c.criteria)}</p><p><b>Dependencies</b><br>${esc(c.dependencies)}</p><p><b>Source</b><br>${esc(c.source)}</p></details>${c.state==='Draft'?`<div class="toolbar"><button class="btn primary" onclick="approveCapture('${c.id}')">Approve & add to registry</button><button class="btn danger" onclick="removeCapture('${c.id}')">Discard</button></div>`:''}</div>`).join(''):'<div class="empty">No drafts yet. Only mature, actionable conclusions belong here.</div>'}</section></div><div class="note">Approval updates this prototype's feature registry. Publishing to Notion will require a secure server-side integration and an authorized destination workspace.</div>`}function addCapture(e){e.preventDefault();db.captures.unshift({id:'C-'+Date.now(),...Object.fromEntries(new FormData(e.target)),state:'Draft',created:new Date().toLocaleDateString()});persist();render()}function approveCapture(id){let c=db.captures.find(x=>x.id===id);if(!c||c.state!=='Draft')return;c.state='Approved';db.features.push({id:'F-'+String(Date.now()).slice(-7),name:c.title,area:'Command Center',phase:'Later',status:'Backlog',priority:'Medium',details:c.objective+' — '+c.requirements,criteria:c.criteria});persist();render()}function removeCapture(id){if(!confirm('Discard this draft?'))return;db.captures=db.captures.filter(c=>c.id!==id);persist();render()}
function governance(){return `<h2>Product Governance</h2><p class="muted">Foundational boundaries that must inform all subsequent design.</p><div class="grid">${[['Access without tolls','Recruiters can contact opted-in talent without paying per-message fees. Free network participation is never contingent on a jobseeker subscription.'],['Candidate agency','Candidates control their network participation, availability and approved contact information. A recruiter’s access does not confer candidate ownership.'],['Accountability within control','Recruiting users are responsible for authorized representation and submissions. Stapphire remains responsible for its own security, platform operations and legal duties.'],['AI is decision support','Criteria alignment is explainable, not a hiring-success probability. Human judgment and applicable fairness safeguards remain essential.'],['Data boundaries','Corporate recruiters, independent consultants, agencies and invited hiring managers receive appropriately scoped permissions.'],['Decision discipline','Only reviewed and approved specifications become official requirements. Proposed and superseded decisions remain distinguishable.']].map(([a,b])=>`<section class="panel"><h3>${a}</h3><p>${b}</p></section>`).join('')}</div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stapphire-command-center-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.features)||!Array.isArray(obj.decisions)||!Array.isArray(obj.captures))throw Error('Invalid backup');if(!confirm('Replace local project data with this backup?'))return;db=obj;persist();render()}catch(err){alert('Unable to import: '+err.message)}e.target.value=''}render();
</script></body></html>
